[project]
name = "zodfl"
version = "0.1.0"
description = "Single-pass federated self-supervised learning on ZOD: do rare driving conditions survive federation?"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "torch",
    "torchvision",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]
report = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
