# Stage 1 experiment design: one [[run]] per tag. `overrides` replace fields of config/default.toml.
# Seeds come from [run] seeds in default.toml unless a run lists its own.
# Written before any result existed (hypotheses H1-H3 in docs/BLUEPRINT.md).

[[run]]
tag = "init"                 # reference: ImageNet backbone, no federated training
train = false

[[run]]
tag = "central_all"          # reference: all stream frames pooled in one client, every frame used
centralized = true
overrides = { selection = { kind = "all", budget = 1.0 } }

[[run]]
tag = "fedavg_all"           # every frame used, plain FedAvg
overrides = { selection = { kind = "all", budget = 1.0 }, aggregation = { kind = "fedavg" } }

[[run]]
tag = "balanced_all"
overrides = { selection = { kind = "all", budget = 1.0 }, aggregation = { kind = "balanced" } }

# ---- budget 0.2: 4 selection rules x 2 aggregators
[[run]]
tag = "fedavg_random20"
overrides = { selection = { kind = "random", budget = 0.2 }, aggregation = { kind = "fedavg" } }

[[run]]
tag = "balanced_random20"
overrides = { selection = { kind = "random", budget = 0.2 }, aggregation = { kind = "balanced" } }

[[run]]
tag = "fedavg_loss20"
overrides = { selection = { kind = "loss", budget = 0.2 }, aggregation = { kind = "fedavg" } }

[[run]]
tag = "balanced_loss20"
overrides = { selection = { kind = "loss", budget = 0.2 }, aggregation = { kind = "balanced" } }

[[run]]
tag = "fedavg_novelty20"
overrides = { selection = { kind = "novelty", budget = 0.2 }, aggregation = { kind = "fedavg" } }

[[run]]
tag = "balanced_novelty20"
overrides = { selection = { kind = "novelty", budget = 0.2 }, aggregation = { kind = "balanced" } }

[[run]]
tag = "fedavg_rarity20"
overrides = { selection = { kind = "rarity", budget = 0.2 }, aggregation = { kind = "fedavg" } }

[[run]]
tag = "balanced_rarity20"
overrides = { selection = { kind = "rarity", budget = 0.2 }, aggregation = { kind = "balanced" } }
