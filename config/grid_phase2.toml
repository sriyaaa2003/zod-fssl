# Phase-2 experiment design (hypotheses in docs/BLUEPRINT.md section 16, written before any of these ran).
# P5: published aggregation methods.  P1: the adaptation tax.  Seeds come from config/default.toml.

[[run]]
tag = "ldawa_random20"
overrides = { selection = { kind = "random", budget = 0.2 }, aggregation = { kind = "ldawa" } }

[[run]]
tag = "ldawa_all"
overrides = { selection = { kind = "all", budget = 1.0 }, aggregation = { kind = "ldawa" } }

[[run]]
tag = "ldawa_norm_random20"
overrides = { selection = { kind = "random", budget = 0.2 }, aggregation = { kind = "ldawa_norm" } }

[[run]]
tag = "ldawa_norm_all"
overrides = { selection = { kind = "all", budget = 1.0 }, aggregation = { kind = "ldawa_norm" } }

[[run]]
tag = "fedema_random20"
overrides = { selection = { kind = "random", budget = 0.2 }, aggregation = { kind = "fedema" } }

[[run]]
tag = "fedema_all"
overrides = { selection = { kind = "all", budget = 1.0 }, aggregation = { kind = "fedema" } }

[[run]]
tag = "layer4only_random20"
overrides = { selection = { kind = "random", budget = 0.2 }, federation = { train_layers = ["layer4"] } }

[[run]]
tag = "anchor01_random20"
overrides = { selection = { kind = "random", budget = 0.2 }, federation = { anchor_mu = 0.1 } }

[[run]]
tag = "anchor1_random20"
overrides = { selection = { kind = "random", budget = 0.2 }, federation = { anchor_mu = 1.0 } }

[[run]]
tag = "anchor10_random20"
overrides = { selection = { kind = "random", budget = 0.2 }, federation = { anchor_mu = 10.0 } }

[[run]]
tag = "tax_random20"
overrides = { selection = { kind = "random", budget = 0.2 }, eval = { interp_alphas = [0.25, 0.5, 0.75] } }

[[run]]
tag = "layer4only_all"
overrides = { selection = { kind = "all", budget = 1.0 }, federation = { train_layers = ["layer4"] } }

[[run]]
tag = "anchor01_all"
overrides = { selection = { kind = "all", budget = 1.0 }, federation = { anchor_mu = 0.1 } }

[[run]]
tag = "anchor1_all"
overrides = { selection = { kind = "all", budget = 1.0 }, federation = { anchor_mu = 1.0 } }

[[run]]
tag = "anchor10_all"
overrides = { selection = { kind = "all", budget = 1.0 }, federation = { anchor_mu = 10.0 } }

[[run]]
tag = "tax_all"
overrides = { selection = { kind = "all", budget = 1.0 }, eval = { interp_alphas = [0.25, 0.5, 0.75] } }
